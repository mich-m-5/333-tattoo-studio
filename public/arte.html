<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Arte | 333 Tattoo Studio</title>
    <link rel="icon" href="tattoo/logo.png" type="image/jpeg">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }

        .arte-hero {
            height: 60vh;
            position: relative;
            background-image: url('tattoo/logo.png'); /* Foto de fondo */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .arte-hero::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1;
        }
        .hero-banner-content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 0 20px;
        }
        .hero-banner-content h1 {
            font-size: 80px;
            text-transform: uppercase;
            letter-spacing: 15px;
            font-weight: 900;
            text-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        .profile-overlap {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 5px solid #000;
            object-fit: cover;
            position: absolute;
            bottom: -90px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: #111;
        }

        .arte-section {
            padding: 120px 5% 60px;
            background: #000;
        }
        .arte-content {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Tatuadores Minimalistas (Tarjetas de Presentación) */
        .artists-row {
            display: flex;
            justify-content: center;
            gap: 80px;
            margin-bottom: 60px;
            flex-wrap: wrap;
        }
        .mini-artist-card {
            text-align: center;
            max-width: 350px;
            text-decoration: none;
            transition: 0.3s;
        }
        .mini-artist-card:hover { transform: translateY(-10px); }
        .mini-artist-card img {
            width: 220px;
            height: 220px;
            border-radius: 20px;
            object-fit: cover;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .mini-artist-card h3 { font-size: 28px; color: #0070c9; margin-bottom: 5px; }
        .mini-artist-card span { color: #666; text-transform: uppercase; letter-spacing: 2px; font-size: 14px; }
        .mini-artist-card p { color: #aaa; margin-top: 15px; line-height: 1.6; }

        /* Sección Tags/Firmas */
        .tags-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 60px 0;
            flex-wrap: wrap;
        }
        .tag-video {
            width: 45%;
            min-width: 300px;
            max-width: 500px;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #222;
        }
        .tag-video video { width: 100%; display: block; }

        /* Galerías Animadas Infinitas */
        .marquee-wrapper {
            width: 100vw;
            margin-left: calc(-5vw);
            overflow: hidden;
            padding: 40px 0;
            position: relative;
        }
        .marquee-content {
            display: flex;
            gap: 20px;
            width: max-content;
        }
        
        /* Animación Izquierda */
        .animate-left { animation: scrollLeft 40s linear infinite; }
        /* Animación Derecha */
        .animate-right { animation: scrollRight 40s linear infinite; }

        @keyframes scrollLeft {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        @keyframes scrollRight {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0); }
        }

        .marquee-item {
            width: 350px;
            height: 350px;
            flex-shrink: 0;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
        }
        .marquee-item img {
            width: 100%; height: 100%; object-fit: cover;
            transition: 0.5s;
        }
        .marquee-item:hover img { transform: scale(1.1); }

        .section-title-big {
            text-align: center;
            font-size: 50px;
            margin: 100px 0 40px;
            text-transform: uppercase;
            letter-spacing: 8px;
            font-weight: 900;
            color: #fff;
        }

        .back-nav {
            position: fixed; top: 20px; left: 20px; z-index: 1000;
            background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 30px;
            color: white; text-decoration: none; backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1); font-weight: bold;
        }

        /* Responsividad Móvil */
        @media (max-width: 768px) {
            .hero-banner-content h1 {
                font-size: 35px;
                letter-spacing: 5px;
            }
            .arte-hero { height: 40vh; }
            .profile-overlap { width: 130px; height: 130px; bottom: -65px; }
            .arte-section { padding: 90px 5% 40px; }
            .section-title-big { font-size: 28px; letter-spacing: 4px; margin: 60px 0 20px; }
            .marquee-item { width: 250px; height: 250px; }
            .tag-video { width: 100%; }
            .back-nav { top: 10px; left: 10px; padding: 8px 15px; font-size: 14px; }
            
            .artists-row { gap: 40px; margin-bottom: 40px; }
            .mini-artist-card img { width: 180px; height: 180px; }
            .mini-artist-card h3 { font-size: 22px; }
            .mini-artist-card p { font-size: 14px; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-nav"><i class="fas fa-arrow-left"></i> INICIO</a>

    <header class="arte-hero">
        <div class="hero-banner-content">
            <h1>TATUADORES</h1>
        </div>
        <!-- Foto pequeña circular que se solapa -->
        <img src="tattoo/dos.png" class="profile-overlap" alt="333 Tattoo Studio">
    </header>

    <section class="arte-section">
        <div class="arte-content">
            
            <div class="artists-row">
                <a href="https://www.instagram.com/htts_michael._/" target="_blank" class="mini-artist-card">
                    <img src="tattoo/WhatsApp Image 2026-03-11 at 10.16.08 PM.jpeg" alt="Mich Muzo">
                    <h3>MICH MUZO</h3>
                    <span>Artista & Tatuador</span>
                    <p>Especialista en detalles finos y composiciones personalizadas.</p>
                </a>
                <a href="https://www.instagram.com/333._uio/" target="_blank" class="mini-artist-card">
                    <img src="tattoo/WhatsApp Image 2026-03-11 at 10.16.09 PM.jpeg" alt="Tomas Segura">
                    <h3>TOMAS SEGURA</h3>
                    <span>Artista & Tatuador</span>
                    <p>Apasionado por el arte callejero y el realismo crudo.</p>
                </a>
            </div>

            <h2 class="section-title-big">FIRMAS & TAGS</h2>
            <div id="tags-gallery" class="tags-container">
                <!-- Aquí irán los 2 videos de firmas -->
            </div>

            <h2 class="section-title-big">NOSOTROS</h2>
            <div class="marquee-wrapper">
                <div id="nosotros-marquee" class="marquee-content animate-right">
                    <!-- Fotos de Mich y Tomas -->
                </div>
            </div>

            <h2 class="section-title-big">GRAFFITIS</h2>
            <div class="marquee-wrapper">
                <div id="graffiti-marquee" class="marquee-content animate-left">
                    <!-- Contenido duplicado para loop infinito -->
                </div>
            </div>

            <h2 class="section-title-big">ARTE</h2>
            <div class="marquee-wrapper">
                <div id="dibujos-marquee" class="marquee-content animate-right">
                    <!-- Contenido duplicado para loop infinito -->
                </div>
            </div>

        </div>
    </section>

    <!-- Lightbox para Nuestro Arte -->
    <div id="lightbox" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10000; justify-content: center; align-items: center; cursor: pointer;" onclick="closeFull()">
        <span style="position: absolute; top: 20px; right: 30px; color: white; font-size: 40px; font-weight: bold;">&times;</span>
        <div class="lightbox-content" style="max-width: 90%; max-height: 90%;" onclick="event.stopPropagation()">
            <img id="lightbox-img" src="" style="max-width: 100%; max-height: 90vh; border-radius: 5px; box-shadow: 0 0 30px rgba(0,0,0,0.5);">
        </div>
    </div>

    <!-- Música de fondo (Heaven and Hell - Black Sabbath) -->
    <div id="bg-music-container" style="position: fixed; bottom: 20px; left: 20px; z-index: 9999; display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(5px);">
        <button id="music-toggle" style="background: none; border: none; color: white; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px;">
            <i class="fas fa-play"></i>
        </button>
        <span style="font-size: 12px; color: white; font-family: sans-serif; margin-right: 10px; white-space: nowrap;">Heaven and Hell - Black Sabbath</span>
        <div id="youtube-player" style="display: none;"></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                videoId: 'RVUK2rtAkJE',
                playerVars: {
                    'autoplay': 1,
                    'loop': 1,
                    'playlist': 'RVUK2rtAkJE',
                    'controls': 0,
                    'showinfo': 0,
                    'modestbranding': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            const toggleBtn = document.getElementById('music-toggle');
            toggleBtn.addEventListener('click', () => {
                if (player.getPlayerState() === YT.PlayerState.PLAYING) {
                    player.pauseVideo();
                    toggleBtn.innerHTML = '<i class="fas fa-play"></i>';
                } else {
                    player.playVideo();
                    toggleBtn.innerHTML = '<i class="fas fa-pause"></i>';
                }
            });
            player.playVideo();
        }

        function onPlayerStateChange(event) {
            const toggleBtn = document.getElementById('music-toggle');
            if (event.data === YT.PlayerState.PLAYING) {
                toggleBtn.innerHTML = '<i class="fas fa-pause"></i>';
            } else {
                toggleBtn.innerHTML = '<i class="fas fa-play"></i>';
            }
        }

        async function loadArte() {
            // Función para asegurar suficiente contenido para el loop
            const generateLoopHtml = (items) => {
                if (items.length === 0) return '';
                let html = items.map(img => `
                    <div class="marquee-item" onclick="openFull('${img.imageUrl}')">
                        <img src="${img.imageUrl}">
                    </div>
                `).join('');
                // Duplicamos varias veces para asegurar que el marquee siempre esté lleno
                return html + html + html + html;
            };

            // Cargar Nosotros (Mich y Tomas)
            try {
                const resMich = await fetch('/api/arte/mich');
                const michData = await resMich.json();
                const resTomas = await fetch('/api/arte/tomas');
                const tomasData = await resTomas.json();
                
                let combined = [...michData, ...tomasData];
                
                // Si no hay fotos en la base de datos, usamos locales por defecto
                if (combined.length === 0) {
                    combined = [
                        { imageUrl: 'tattoo/mich.jpeg' },
                        { imageUrl: 'tattoo/TATUADORES.jpeg' },
                        { imageUrl: 'tattoo/WhatsApp Image 2026-03-11 at 10.16.08 PM.jpeg' },
                        { imageUrl: 'tattoo/WhatsApp Image 2026-03-11 at 10.16.09 PM.jpeg' }
                    ];
                }
                document.getElementById('nosotros-marquee').innerHTML = generateLoopHtml(combined);
            } catch (e) { 
                console.error("Error cargando Nosotros:", e);
                // Fallback manual en caso de error de red
                const fallback = [
                    { imageUrl: 'tattoo/mich.jpeg' },
                    { imageUrl: 'tattoo/TATUADORES.jpeg' },
                    { imageUrl: 'tattoo/WhatsApp Image 2026-03-11 at 10.16.08 PM.jpeg' },
                    { imageUrl: 'tattoo/WhatsApp Image 2026-03-11 at 10.16.09 PM.jpeg' }
                ];
                document.getElementById('nosotros-marquee').innerHTML = generateLoopHtml(fallback);
            }

            // Cargar Tags (Videos)
            try {
                const resTags = await fetch('/api/arte/tags');
                const tags = await resTags.json();
                document.getElementById('tags-gallery').innerHTML = tags.slice(0,2).map(v => `
                    <div class="tag-video">
                        <video src="${v.imageUrl}" muted loop autoplay playsinline></video>
                    </div>
                `).join('');
            } catch (e) { console.error("Error cargando Tags:", e); }

            // Cargar Graffitis (Animación Izquierda)
            try {
                const resGraf = await fetch('/api/arte/graffiti');
                const grafs = await resGraf.json();
                document.getElementById('graffiti-marquee').innerHTML = generateLoopHtml(grafs);
            } catch (e) { console.error("Error cargando Graffitis:", e); }

            // Cargar Dibujos (Animación Derecha)
            try {
                const resDib = await fetch('/api/arte/dibujos');
                const dibs = await resDib.json();
                document.getElementById('dibujos-marquee').innerHTML = generateLoopHtml(dibs);
            } catch (e) { console.error("Error cargando Dibujos:", e); }
            
            muteAllVideos();
        }

        function openFull(url) {
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            img.src = url;
            lightbox.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeFull() {
            const lightbox = document.getElementById('lightbox');
            lightbox.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function muteAllVideos() {
            document.querySelectorAll('video').forEach(v => {
                v.muted = true;
                v.setAttribute('muted', '');
            });
        }

        // Intento de reproducción automática al primer clic en cualquier parte
        document.addEventListener('click', () => {
            if (player && player.getPlayerState() !== YT.PlayerState.PLAYING) {
                player.playVideo();
            }
        }, { once: true });

        window.onload = loadArte;
    </script>
</body>
</html>
